services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: recallloop
      POSTGRES_PASSWORD: recallloop
      POSTGRES_DB: recallloop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallloop -d recallloop"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - recallloop_postgres:/var/lib/postgresql/data

volumes:
  recallloop_postgres:
