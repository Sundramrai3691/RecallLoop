services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - recallloop_mongo:/data/db
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: recallloop
      POSTGRES_PASSWORD: recallloop
      POSTGRES_DB: recallloop
    ports:
      - "5432:5432"
    volumes:
      - recallloop_postgres:/var/lib/postgresql/data

volumes:
  recallloop_mongo:
  recallloop_postgres:
